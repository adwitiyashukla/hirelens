name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests

      - name: Types
        run: mypy src
        continue-on-error: true

      - name: Tests
        run: pytest -q --cov=hirelens --cov-report=term-missing

  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  eval:
    name: evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Harness smoke test
        run: python scripts/smoke_eval.py

      - name: Bias audit smoke test
        run: python scripts/smoke_audit.py

      - name: Regression gate
        run: |
          if [ -f evals/reports/baseline.json ] && [ -f evals/reports/latest.json ]; then
            python -m hirelens.evals.cli gate
          else
            echo "No committed baseline yet; skipping the regression gate."
          fi
