app = "hirelens"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HIRELENS_LLM_PROVIDER = "gemini"
  HIRELENS_GEMINI_MODEL = "gemini-flash-latest"
  HIRELENS_BLIND_MODE = "true"
  HIRELENS_DATABASE_URL = "sqlite+aiosqlite:////data/hirelens.db"
  HIRELENS_CACHE_DIR = "/data/cache"
  HIRELENS_REQUESTS_PER_MINUTE = "10"
  HIRELENS_MAX_CONCURRENT_REQUESTS = "2"

[[mounts]]
  source = "hirelens_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
